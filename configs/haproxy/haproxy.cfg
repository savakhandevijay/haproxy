global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms    

# --- Stats dashboard ---
frontend stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s

# --- Entry point for all incoming traffic ---
frontend http_front
    mode http
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/techlab.dev.pem
    default_backend web_servers

backend web_servers
    mode http
    balance roundrobin
    option http-server-close
    option forwardfor
    server web1 web1:80 check
    server web2 web2:80 check
    server web3 web3:80 check
